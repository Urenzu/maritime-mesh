services:

  # ── Sim (optional profile) ────────────────────────────────────────────────────
  sim:
    build:
      context: .
      dockerfile: docker/sim.Dockerfile
    environment:
      SIM_ADDR: "0.0.0.0:10110"
    ports:
      - "10110:10110"
    profiles: ["sim"]

  # ── Ingest (live AISStream) ───────────────────────────────────────────────────
  # Acts as the Zenoh peer that listens on a fixed port so the api can connect
  # without a separate zenohd router (no UDP multicast needed on Docker bridge).
  ingest:
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    env_file: .env
    environment:
      GHOST_LOG_PATH: /data/ghost-log
      ZENOH_LISTEN: "0.0.0.0:7447"
    volumes:
      - ghost-log-data:/data/ghost-log
    restart: unless-stopped

  # ── Ingest (sim mode) ─────────────────────────────────────────────────────────
  ingest-sim:
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    environment:
      GHOST_LOG_PATH: /data/ghost-log
      ZENOH_LISTEN: "0.0.0.0:7447"
      AISSTREAM_MODE: "sim"
      SIM_HOST: "sim"
      SIM_PORT: "10110"
    volumes:
      - ghost-log-data:/data/ghost-log
    depends_on:
      - sim
    profiles: ["sim"]
    restart: unless-stopped

  # ── API ───────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      GHOST_LOG_PATH: /data/ghost-log
      BIND_ADDR: "0.0.0.0:8080"
      DARK_ZONE_THRESHOLD_MINS: "15"
      ZENOH_PEER: "ingest:7447"
    volumes:
      - ghost-log-data:/data/ghost-log
    ports:
      - "8080:8080"
    depends_on:
      - ingest
    restart: unless-stopped

  api-sim:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      GHOST_LOG_PATH: /data/ghost-log
      BIND_ADDR: "0.0.0.0:8080"
      DARK_ZONE_THRESHOLD_MINS: "15"
      ZENOH_PEER: "ingest-sim:7447"
    volumes:
      - ghost-log-data:/data/ghost-log
    ports:
      - "8080:8080"
    depends_on:
      - ingest-sim
    profiles: ["sim"]
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  ghost-log-data:
